<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tricia Linewberg - Portfolio</title>
  <meta name="description" content="Tricia Linewberg - Designer portfolio. The grandest show of strategy and design.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Faustina:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="hero-page">

  <section class="hero">
    <div class="hero-content">
      <h1 id="line1" class="hero-title-line"></h1>
      <h1 id="line2" class="hero-title-line"></h1>
      <h1 id="line3" class="hero-title-line"></h1>
      <p id="subtitle" class="hero-subtitle"></p>
      <a href="portfolio.html" id="admit-btn" class="admit-one-btn golden-pill">
        ADMIT ONE
      </a>
    </div>

    <div id="hero-photo" class="hero-photo">
      <img src="assets/tricia.png" alt="Tricia Linewberg">
    </div>
  </section>

  <script>
    async function typeWords(elementId, text, speed) {
      const el = document.getElementById(elementId);
      const words = text.split(' ');
      for (const w of words) {
        const span = document.createElement('span');
        span.textContent = w;
        span.className = 'word';
        el.appendChild(span);
        await new Promise(r => setTimeout(r, 50));
        span.classList.add('visible');
        await new Promise(r => setTimeout(r, speed));
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await typeWords('line1', 'WELCOME,', 500);
      await typeWords('line2', 'WELCOME TO', 350);
      await typeWords('line3', 'MY PORTFOLIO!', 500);
      await new Promise(r => setTimeout(r, 200));
      await typeWords('subtitle', 'The grandest show of strategy and design on land or by screen.', 120);

      setTimeout(() => {
        document.getElementById('hero-photo').classList.add('reveal');
      }, 400);

      setTimeout(() => {
        const btn = document.getElementById('admit-btn');
        btn.classList.add('reveal');
        setTimeout(() => btn.classList.add('breathing'), 1500);
      }, 1200);
    });
  </script>
</body>
</html>
