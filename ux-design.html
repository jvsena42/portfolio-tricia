<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UX Design - Tricia Linewberg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Faustina:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .coming-soon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      gap: var(--space-lg);
    }

    .coming-soon__title {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      color: var(--color-purple-deep);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .coming-soon__subtitle {
      font-family: var(--font-heading);
      font-size: 24px;
      color: var(--color-text-dark);
      opacity: 0.7;
      font-style: italic;
    }

    .coming-soon__divider {
      width: 80px;
      height: 2px;
      background: var(--color-gold);
    }

    @media (min-width: 768px) {
      .coming-soon__title {
        font-size: 72px;
      }
      .coming-soon__subtitle {
        font-size: 28px;
      }
    }

    @media (min-width: 1024px) {
      .coming-soon__title {
        font-size: 88px;
      }
    }
  </style>
</head>
<body class="bg-gold page-entrance">

  <!-- Header -->
  <header class="page-header">
    <a href="portfolio.html" class="back-btn" aria-label="Back to portfolio">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1 class="page-title h0">UX Design</h1>
    <div class="mini-card">
      <svg width="28" height="28" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="14" width="44" height="32" rx="3" stroke="#c9a84c" stroke-width="2"/>
        <line x1="14" y1="24" x2="58" y2="24" stroke="#c9a84c" stroke-width="1.5"/>
        <line x1="30" y1="46" x2="42" y2="46" stroke="#c9a84c" stroke-width="2"/>
        <line x1="36" y1="46" x2="36" y2="56" stroke="#c9a84c" stroke-width="2"/>
        <line x1="26" y1="56" x2="46" y2="56" stroke="#c9a84c" stroke-width="2"/>
      </svg>
    </div>
  </header>

  <main>
    <div class="coming-soon">
      <div class="coming-soon__divider anim-hidden"></div>
      <h2 class="coming-soon__title anim-hidden anim-delay-1">Coming Soon</h2>
      <p class="coming-soon__subtitle anim-hidden anim-delay-2">The curtain hasn't risen on this act yet.</p>
      <div class="coming-soon__divider anim-hidden anim-delay-3"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer container">
    <div class="footer-col">
      <span>E-mail: <a href="mailto:triciaux@gmail.com">triciaux@gmail.com</a></span>
      <span>Phone: <a href="tel:+5586995473936">+55 (86) 99547-3936</a></span>
    </div>
    <div class="footer-col" style="text-align: right;">
      <span>Instagram: <a href="https://instagram.com/tricialinewberg" target="_blank" rel="noopener">@tricialinewberg</a></span>
      <span>LinkedIn: <a href="https://linkedin.com/in/tricialinewberg" target="_blank" rel="noopener">Tricia Linewberg</a></span>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
